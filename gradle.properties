# Gradle Settings
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
org.gradle.caching=true
org.gradle.configuration-cache=true

# Android AndroidX support
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin DSL options
kotlin.code.style=official
org.jetbrains.compose.experimental.jwm.enabled=true

# Homebrew's JDK distribution trips Compose Desktop's packaging vendor check
# (github.com/JetBrains/compose-multiplatform/issues/3107) even though it
# packages fine; this is used for local jpackage builds on the maintainer's Mac.
compose.desktop.packaging.checkJdkVendor=false
